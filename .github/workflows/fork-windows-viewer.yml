# Fork only: builds the Windows viewer extension (the game DLL) so a Windows player can run this fork's build.
# The DLL replaces the one in upstream's Windows player download. Both sides of a multiplayer match must report
# the same build identity, so the identity is fixed here; build the Linux viewer with the same value
# (-DEAWR_BUILD_IDENTITY=<value below>). Bump it whenever the two builds would no longer match.
name: Fork Windows viewer

on:
  push:
    branches: ['port-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-viewer-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_CPP_TAG: 10.0.0-stable
  GODOT_CPP_COMMIT: 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
  EAWR_FORK_BUILD_IDENTITY: 0.3.3-fork1

jobs:
  windows-viewer:
    name: windows-x64 viewer DLL
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the pinned godot-cpp
        id: godot-cpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/godot/deps/godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}

      - name: Fetch the pinned godot-cpp
        if: ${{ steps.godot-cpp.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GODOT_CPP_TAG" https://github.com/godotengine/godot-cpp.git out/godot/deps/godot-cpp
          test "$(git -C out/godot/deps/godot-cpp rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      # CL=-MP (the dash form: Git Bash would rewrite "/MP" as a path): cl compiles a project's files in parallel (the Visual Studio generator's default is one at a time,
      # which does not fit the runner's time limit).
      - name: Build the viewer extension
        shell: bash
        env:
          CL: -MP
        run: |
          set -euo pipefail
          cmake -S apps/viewer -B out/build/viewer -G "Visual Studio 17 2022" -A x64 \
            -DEAWR_BUILD_IDENTITY="$EAWR_FORK_BUILD_IDENTITY" -DEAWR_WARNINGS_AS_ERRORS=OFF
          cmake --build out/build/viewer --config Release --target eawr_viewer --parallel 4
          ls -l apps/viewer/project/bin/

      - name: Upload the DLL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eawr-fork-windows-viewer
          path: apps/viewer/project/bin/libeawr_viewer.windows.template_release.x86_64.dll
          if-no-files-found: error
          retention-days: 30
